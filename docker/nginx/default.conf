map $arg_v $vetgeme_versioned_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

map $uri $vetgeme_cache_control {
    /healthz   "no-store";
    /           "no-cache";
    /index.html "no-cache";
    default     $vetgeme_versioned_cache;
}

map $status $vetgeme_allow {
    default "";
    405     "GET, HEAD";
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;
    client_max_body_size 16k;

    sendfile on;
    tcp_nopush on;
    etag on;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Keep every add_header at server scope: a location-level add_header would
    # suppress inheritance of the security policy below.
    add_header Cache-Control $vetgeme_cache_control always;
    add_header Allow $vetgeme_allow always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' 'unsafe-eval'; script-src-elem 'self'; script-src-attr 'none'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; media-src 'none'; worker-src 'none'; frame-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~ (?:^|/)\. {
        return 404;
    }

    location = /content/registry.json {
        try_files $uri =404;
    }

    location ~* ^/content/packs/tier-01-v2/(?:campaign/tier-01/[a-z0-9-]+|clinical/tier-01/(?:[a-z0-9-]+/)?[a-z0-9-]+|multi-diagnosis/[a-z0-9-]+|owners/tier-01/[a-z0-9-]+|ui/[a-z0-9-]+)\.json$ {
        try_files $uri =404;
    }

    location ~* ^/content(?:/|$) {
        return 404;
    }

    location ~* ^/(?:node_modules|docs|scripts|reports|artifacts|handoff)(?:/|$) {
        return 404;
    }

    location ~* ^/legacy/content(?:/|$) {
        return 404;
    }

    location ~* ^/art/(?!runtime-v2(?:/|$)) {
        return 404;
    }

    location ~* ^/tier-01-v2/(?:content|docs|reports|scripts|future)(?:/|$) {
        return 404;
    }

    location ~* (?:^|/)(?:AGENTS\.md|README(?:_[^/]*)?\.md|package(?:-lock)?\.json|Dockerfile|compose(?:\.[^/]*)?\.ya?ml)$ {
        return 404;
    }

    location ~ /$ {
        return 404;
    }

    location ~* \.(?:css|js|json|png)$ {
        try_files $uri =404;
    }

    # VetGEME is not an SPA; an unknown path must never receive index.html.
    location / {
        return 404;
    }
}
